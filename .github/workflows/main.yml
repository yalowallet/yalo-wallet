
name: YALO Wallet Validation

on:
  push:
    branches:
      - main
      - feature/usdt-xof-market
  pull_request:
    branches:
      - main
      - feature/usdt-xof-market

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Backend tests
        run: node --experimental-strip-types --test test/*.test.ts
        
